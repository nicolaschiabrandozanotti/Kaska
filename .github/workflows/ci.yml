name: CI

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Minimum permissions: read-only access to repository contents. No write or administrative tokens.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      # Supply-chain hardening: GitHub Actions are pinned to verified full-length commit SHAs.
      # Note: Immutable SHA pins require periodic maintenance to incorporate upstream security updates.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions workflows (actionlint)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          WORK_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/actionlint.XXXXXX")"
          trap 'rm -rf "$WORK_DIR"' EXIT
          ARCHIVE_PATH="${WORK_DIR}/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 "$ACTIONLINT_URL" -o "$ARCHIVE_PATH"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check --strict
          tar -xzf "$ARCHIVE_PATH" -C "$WORK_DIR" actionlint
          "${WORK_DIR}/actionlint" -color .github/workflows/*.yml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Clippy static analysis
        run: cargo clippy --workspace --all-targets --jobs 2 -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked --jobs 2 -- --test-threads=2

      - name: Build kaska-http headless library
        run: cargo build --package kaska-http --locked --jobs 2

      - name: Build kaska-desktop binary (dev)
        run: cargo build --package kaska-desktop --locked --jobs 2

      - name: Build workspace (release)
        run: cargo build --workspace --release --locked --jobs 2

      - name: Headless smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\kaska-desktop.exe --headless-test

      - name: Headless smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./target/release/kaska-desktop --headless-test

      - name: Verify socket listeners released (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targetPorts = @(18080, 18989)
          try {
            $properties = [System.Net.NetworkInformation.IPGlobalProperties]::GetIPGlobalProperties()
            $activeListeners = $properties.GetActiveTcpListeners()
          } catch {
            Write-Error "ERROR: Failed to query active TCP listeners: $_"
            exit 1
          }

          $lingering = $activeListeners | Where-Object { $_.Port -in $targetPorts }
          if ($lingering) {
            $details = $lingering | ForEach-Object { "$($_.Address):$($_.Port)" }
            Write-Error "ERROR: Lingering socket listener detected on test port(s): $($details -join ', ')"
            exit 1
          }
          Write-Host "Socket release verification passed: test ports $targetPorts are free."

      - name: Verify socket listeners released (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if SS_OUT=$(ss -tln 2>&1); then
            :
          else
            rc=$?
            echo "ERROR: ss failed to execute (exit $rc): $SS_OUT" >&2
            exit 1
          fi

          MATCH=$(echo "$SS_OUT" | grep -E ':(18080|18989)\b' || true)
          if [ -n "$MATCH" ]; then
            echo "ERROR: Lingering socket listener detected on test ports 18080/18989:" >&2
            echo "$MATCH" >&2
            exit 1
          fi
          echo "Socket release verification passed: test ports 18080 and 18989 are free."

      - name: Validate workspace metadata
        run: cargo metadata --format-version 1 --no-deps
